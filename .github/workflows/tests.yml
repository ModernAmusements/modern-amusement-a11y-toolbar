name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" > /tmp/chrome-install.txt
          CHROME_PATH="$(grep -E '^chrome@' /tmp/chrome-install.txt | tail -1 | awk '{print $2}')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test
